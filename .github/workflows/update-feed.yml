name: Update Hotel Skansen Feed

on:
  schedule:
    - cron: '0 4 * * *'   # daily at 04:00 UTC (package prices don't change hourly)
  workflow_dispatch:        # manual trigger from the Actions tab
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate feed
        env:
          # Set this to your published GitHub Pages URL so image_link is absolute.
          FEED_BASE_URL: ${{ vars.FEED_BASE_URL }}
        run: node generate-feed.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          keep_files: false
          commit_message: 'Update feed'
